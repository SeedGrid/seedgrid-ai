quarkus.application.name=${APP_NAME:seedgrid-app-api}
quarkus.http.port=${HTTP_PORT:8080}

# CalVer+sha calculado no deploy (ex.: 2026.07.28-b42bbe3), repassado via build-arg do Dockerfile
# -> ENV APP_VERSION. "dev" = rodando fora do pipeline (local/mvn quarkus:dev).
app.build.version=${APP_VERSION:dev}
quarkus.devservices.enabled=false

# Porta 5440 = PostgreSQL de desenvolvimento do docker-compose.yml na raiz.
# A var SEEDGRID_DB_URL (dev.env) sobrescreve; este default so alinha com o ambiente real.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5440/seedgrid_app}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}

# ==== Persistencia (modelo "modular": sem tenancy, uma unica unidade de persistencia) ====
# O schema e dos Flyway das extensions; o Hibernate so mapeia.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.packages=br.com.seedgrid.security.entities,br.com.seedgrid.audit.postgresql.entities,br.com.seedgrid.commons.persistence,br.com.seedgrid.privacy
# Dev mode: o Flyway migra depois da validacao do Hibernate; a validacao so geraria ruido.
quarkus.hibernate-orm.validate-in-dev-mode=false

# Migrations: as das extensions (security, audit) e as DESTE produto em db/migration/app.
# O scan de db/migration/ solto colidiria com as subpastas das extensions.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/security,classpath:db/migration/audit,classpath:db/migration/app

# ============================================================================
# AUDITORIA (seedgrid-audit-postgresql)
# ============================================================================
seedgrid.audit.persistence.strategy=${SEEDGRID_AUDIT_PERSISTENCE_STRATEGY:jpa}

# ============================================================================
# SEEDGRID SECURITY
# ============================================================================
# O @ConfigMapping da extension le o prefixo seedgrid.security.jwt.* (NAO security.jwt.*).
# As envs SEEDGRID_SECURITY_JWT_{PRIVATE,PUBLIC}_KEY_BASE64, quando setadas, VENCEM os caminhos abaixo.
seedgrid.security.jwt.issuer=${SECURITY_JWT_ISSUER:http://localhost:8080}
seedgrid.security.jwt.kid=${SECURITY_JWT_KID:seedgrid-app-local}
seedgrid.security.jwt.ttl=${SECURITY_JWT_TTL:PT8H}
seedgrid.security.jwt.private-key-location=${SECURITY_PRIVATE_KEY_LOCATION:src/main/resources/keys/private.pem}
seedgrid.security.jwt.public-key-location=${SECURITY_PUBLIC_KEY_LOCATION:src/main/resources/keys/public.pem}

seedgrid.security.refresh-token.ttl=${SECURITY_REFRESH_TOKEN_TTL:P30D}
seedgrid.security.password.min-size=${SECURITY_PASSWORD_MIN_SIZE:8}
seedgrid.security.password.upper-case-required=${SECURITY_PASSWORD_UPPER:true}
seedgrid.security.password.lower-case-required=${SECURITY_PASSWORD_LOWER:true}
seedgrid.security.password.special-character-required=${SECURITY_PASSWORD_SPECIAL:true}
seedgrid.security.password.prohibits-repeated-characters-in-sequence=${SECURITY_PASSWORD_NO_REPEAT:true}
seedgrid.security.password.expiration-days=${SECURITY_PASSWORD_EXPIRATION_DAYS:90}
seedgrid.security.password.max-history=${SECURITY_PASSWORD_MAX_HISTORY:5}
seedgrid.security.rbac.cache-ttl=${SECURITY_RBAC_CACHE_TTL:PT5M}
seedgrid.security.encryption.key=${SEEDGRID_SECURITY_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# 2FA: desligado por padrao.
seedgrid.security.2f.enabled=${SEEDGRID_SECURITY_2F_ENABLED:false}
seedgrid.security.2f.allowed-methods=${SEEDGRID_SECURITY_2F_ALLOWED_METHODS:EMAIL,TOTP}
seedgrid.security.2f.totp.issuer=${SEEDGRID_SECURITY_2F_TOTP_ISSUER:SeedGrid}
seedgrid.security.2f.email.code-ttl=${SEEDGRID_SECURITY_2F_EMAIL_CODE_TTL:PT5M}

# E-mail (dev: Mailpit do docker-compose.yml)
seedgrid.security.mailer.from=${SECURITY_MAILER_FROM:noreply@seedgrid.local}
seedgrid.security.mailer.host=${SECURITY_MAILER_HOST:localhost}
seedgrid.security.mailer.port=${SECURITY_MAILER_PORT:1025}
seedgrid.security.mailer.start-tls=${SECURITY_MAILER_START_TLS:DISABLED}
seedgrid.security.mailer.username=${SECURITY_MAILER_USERNAME:}
seedgrid.security.mailer.password=${SECURITY_MAILER_PASSWORD:}

# Avatar
seedgrid.security.avatar.storage=${SEEDGRID_SECURITY_AVATAR_STORAGE:filesystem}
seedgrid.security.avatar.filesystem.base-path=${SEEDGRID_SECURITY_AVATAR_FILESYSTEM_BASE_PATH:./data/seedgrid-security-files}
seedgrid.security.avatar.minio.bucket=${SEEDGRID_SECURITY_AVATAR_MINIO_BUCKET:}
seedgrid.security.avatar.minio.region=${SEEDGRID_SECURITY_AVATAR_MINIO_REGION:us-east-1}
seedgrid.security.avatar.minio.access-key=${SEEDGRID_SECURITY_AVATAR_MINIO_ACCESS_KEY:}
seedgrid.security.avatar.minio.secret-key=${SEEDGRID_SECURITY_AVATAR_MINIO_SECRET_KEY:}
seedgrid.security.avatar.minio.endpoint=${SEEDGRID_SECURITY_AVATAR_MINIO_ENDPOINT:}

# Privacy (seedgrid-privacy): criptografia at-rest de PII. OPT-IN e FAIL-CLOSED: ligar sem as duas
# chaves derruba o boot de proposito. Escolha o modo com o BANCO VAZIO. As chaves moram SO no env.
seedgrid.privacy.encryption.enabled=${SEEDGRID_PRIVACY_ENCRYPTION_ENABLED:false}
seedgrid.privacy.crypto.key=${SEEDGRID_PRIVACY_CRYPTO_KEY:}
seedgrid.privacy.search.key=${SEEDGRID_PRIVACY_SEARCH_KEY:}

# Sem cadastro publico: o produto nao tem signup. Usuarios entram pelo primeiro administrador e
# pelas telas de usuarios. A role padrao nao pode ser vazia (o SmallRye trata "" como null).
seedgrid.security.self-enter.enabled=${SEEDGRID_SECURITY_SELF_ENTER_ENABLED:false}
seedgrid.security.self-enter.public-enabled=${SEEDGRID_SECURITY_SELF_ENTER_PUBLIC_ENABLED:false}
seedgrid.security.self-enter.invite-enabled=${SEEDGRID_SECURITY_SELF_ENTER_INVITE_ENABLED:false}
seedgrid.security.self-enter.default-role=${SEEDGRID_SECURITY_SELF_ENTER_DEFAULT_ROLE:NO_DEFAULT_ROLE}

# Caminhos do front usados nos e-mails (base-url vem do env).
seedgrid.security.frontend.base-url=${SEEDGRID_SECURITY_FRONTEND_BASE_URL:http://localhost:3000}
seedgrid.security.frontend.login-path=${SEEDGRID_SECURITY_FRONTEND_LOGIN_PATH:/login}
seedgrid.security.frontend.password-reset-path=${SEEDGRID_SECURITY_FRONTEND_PASSWORD_RESET_PATH:/auth/forgot-password/confirm}

# Primeiro administrador (criado no boot se ainda nao existe).
seedgrid.security.first-admin-user.email=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_EMAIL:}
seedgrid.security.first-admin-user.name=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_NAME:}
seedgrid.security.first-admin-user.whatsapp=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_WHATSAPP:}
seedgrid.security.first-admin-user.initial-password=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_INITIAL_PASSWORD:}

# Empresa-padrao da security (o modelo de autorizacao depende dela; sempre garantida pela extension).
seedgrid.security.default-company.cnpj=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CNPJ:99999999000199}
seedgrid.security.default-company.corporate-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CORPORATE_NAME:SeedGrid Plataforma}
seedgrid.security.default-company.trade-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_TRADE_NAME:SeedGrid Plataforma}

# ============================================================================
# DIAGNOSTICO
# ============================================================================
# Ligado APENAS no perfil dev: o devMessage carrega ex.getMessage() (SQL, caminhos, colunas).
%dev.seedgrid.show-dev-message=true

# ============================================================================
# LOGGING
# ============================================================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
