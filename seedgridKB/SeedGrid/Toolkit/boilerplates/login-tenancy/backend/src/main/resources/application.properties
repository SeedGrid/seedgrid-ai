quarkus.application.name=${APP_NAME:seedgrid-app-api}
quarkus.http.port=${HTTP_PORT:8080}

# CalVer+sha calculado no deploy.yml (ex.: 2026.07.28-b42bbe3), repassado via build-arg do
# Dockerfile -> ENV APP_VERSION. Logado no boot (StartupBannerLogger) pra dar pra conferir
# no log qual build efetivamente subiu. "dev" = rodando fora do pipeline (local/mvn quarkus:dev).
app.build.version=${APP_VERSION:dev}
quarkus.devservices.enabled=false

# Porta 5440 = PostgreSQL de desenvolvimento do docker-compose.yml na raiz.
# A var SEEDGRID_DB_URL (dev.env) sobrescreve; este default so alinha com o ambiente real.
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5440/seedgrid_app}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}

# ==== OpenTelemetry -> LGTM (Grafana/Tempo/Mimir/Loki) ====
# service.name = quarkus.application.name. DESLIGADO por padrao para nao tentar exportar em
# dev/test/prod-sem-config; liga no prod com OTEL_SDK_DISABLED=false.
# O endpoint OTLP NAO e a UI do Grafana: e a porta de ingest do otel-lgtm (4318 HTTP / 4317 gRPC),
# de preferencia pela rede interna (ex.: http://<servico-lgtm>:4318).
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
# Amostragem de traces: 100% por padrao; reduza no prod (ex.: 0.1) via env se o volume pesar.
quarkus.otel.traces.sampler=${OTEL_TRACES_SAMPLER:parentbased_always_on}
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}
# Sinais de metrica e log via OTLP (instrumentacao presente; so exporta com o SDK ligado).
quarkus.otel.metrics.enabled=${OTEL_METRICS_ENABLED:true}
quarkus.otel.logs.enabled=${OTEL_LOGS_ENABLED:true}

# Fuso em que o NEGOCIO conta os dias (virada do ciclo de cobranca, competencia mensal do
# dashboard). Nao e' o fuso do servidor: o container roda em UTC, e usar o relogio dele fazia uma
# assinatura iniciada as 21h do dia 31 valer como dia 1o. Ver BusinessTimeZone.
seedgrid.app.business-timezone=${SEEDGRID_APP_BUSINESS_TIMEZONE:America/Sao_Paulo}

# ============================================================================
# FOUNDATION login-tenancy
# ============================================================================
# NAO existe seedgrid.login-tenancy.enabled: a dependencia no pom JA ativa o baseline.
# O Flyway nativo do Quarkus fica desligado pela extension (migrations sao per-schema).
# As migrations DESTE produto vao em src/main/resources/db/migration/app/ — nao em db/migration/,
# senao colidem por scan recursivo com as subpastas de foundation (security, audit, ...).
seedgrid.audit.persistence.strategy=${SEEDGRID_AUDIT_PERSISTENCE_STRATEGY:jpa}
seedgrid.login-tenancy.app.code=${SEEDGRID_APP_CODE:seedgrid-app}
seedgrid.login-tenancy.app.name=${SEEDGRID_APP_NAME:SeedGrid App}

# O @ConfigMapping do extension le o prefixo seedgrid.security.jwt.* (NAO security.jwt.*).
# A chave e resolvida via classpath OU filesystem relativo ao CWD do processo.
# Apontamos para src/main/resources/keys/... que existe no filesystem a partir do diretorio onde o
# quarkus:dev roda (backend/), garantindo que o RsaKeyProvider encontre a chave em dev e no jar
# empacotado (onde keys/ vai pro classpath).
# As envs SEEDGRID_SECURITY_JWT_{PRIVATE,PUBLIC}_KEY_BASE64, quando setadas, VENCEM estes caminhos.
seedgrid.security.jwt.issuer=${SECURITY_JWT_ISSUER:http://localhost:8080}
seedgrid.security.jwt.kid=${SECURITY_JWT_KID:seedgrid-app-local}
seedgrid.security.jwt.ttl=${SECURITY_JWT_TTL:PT8H}
seedgrid.security.jwt.private-key-location=${SECURITY_PRIVATE_KEY_LOCATION:src/main/resources/keys/private.pem}
seedgrid.security.jwt.public-key-location=${SECURITY_PUBLIC_KEY_LOCATION:src/main/resources/keys/public.pem}

seedgrid.security.refresh-token.ttl=${SECURITY_REFRESH_TOKEN_TTL:P30D}
seedgrid.security.password.min-size=${SECURITY_PASSWORD_MIN_SIZE:8}
seedgrid.security.password.upper-case-required=${SECURITY_PASSWORD_UPPER:true}
seedgrid.security.password.lower-case-required=${SECURITY_PASSWORD_LOWER:true}
seedgrid.security.password.special-character-required=${SECURITY_PASSWORD_SPECIAL:true}
seedgrid.security.password.prohibits-repeated-characters-in-sequence=${SECURITY_PASSWORD_NO_REPEAT:true}
seedgrid.security.password.expiration-days=${SECURITY_PASSWORD_EXPIRATION_DAYS:90}
seedgrid.security.password.max-history=${SECURITY_PASSWORD_MAX_HISTORY:5}
seedgrid.security.rbac.cache-ttl=${SECURITY_RBAC_CACHE_TTL:PT5M}
seedgrid.security.encryption.key=${SEEDGRID_SECURITY_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

seedgrid.security.2f.enabled=${SEEDGRID_SECURITY_2F_ENABLED:false}
seedgrid.security.2f.allowed-methods=${SEEDGRID_SECURITY_2F_ALLOWED_METHODS:EMAIL,TOTP,WHATSAPP}
# Nome exibido no app autenticador (issuer do otpauth). Sobrepoe o default "SeedGrid" da extensao.
seedgrid.security.2f.totp.issuer=${SEEDGRID_SECURITY_2F_TOTP_ISSUER:SeedGrid}
seedgrid.security.2f.email.code-ttl=${SEEDGRID_SECURITY_2F_EMAIL_CODE_TTL:PT5M}
seedgrid.security.2f.whatsapp.channel-id=${SEEDGRID_SECURITY_2F_WHATSAPP_CHANNEL_ID:}
# Rate limit dos endpoints publicos de 2FA. A extensao vem com 5 verificacoes/15min e 3 reenvios/h,
# e a identidade da chave e' o IP (X-Forwarded-For): num cliente atras de NAT o escritorio INTEIRO
# divide essa cota, entao dois funcionarios logando no mesmo horario ja' derrubavam o terceiro com
# 429. O que protege a conta contra forca bruta continua sendo o limite POR SESSAO de 2FA
# (seedgrid.security.2f.verify.max-attempts=5, que mata o tempToken); aqui o limite e' so' anti-abuso
# por origem, e por isso pode ser mais folgado.
seedgrid.ratelimit.2fa-verify.permits=${SEEDGRID_RATELIMIT_2FA_VERIFY_PERMITS:30}
seedgrid.ratelimit.2fa-verify.window=${SEEDGRID_RATELIMIT_2FA_VERIFY_WINDOW:PT15M}
seedgrid.ratelimit.2fa-resend.permits=${SEEDGRID_RATELIMIT_2FA_RESEND_PERMITS:10}
seedgrid.ratelimit.2fa-resend.window=${SEEDGRID_RATELIMIT_2FA_RESEND_WINDOW:PT1H}

# Sem mailer configurado o e-mail so' vai para o LOG — e o signup "nao chega" sem erro nenhum.
# Ver o alerta interno de falha de envio la' embaixo, que existe por causa disso.
seedgrid.security.mailer.from=${SECURITY_MAILER_FROM:noreply@seedgrid.local}
seedgrid.security.mailer.host=${SECURITY_MAILER_HOST:localhost}
seedgrid.security.mailer.port=${SECURITY_MAILER_PORT:1025}
seedgrid.security.mailer.start-tls=${SECURITY_MAILER_START_TLS:DISABLED}
seedgrid.security.mailer.username=${SECURITY_MAILER_USERNAME:}
seedgrid.security.mailer.password=${SECURITY_MAILER_PASSWORD:}

seedgrid.security.avatar.storage=${SEEDGRID_SECURITY_AVATAR_STORAGE:filesystem}
seedgrid.security.avatar.filesystem.base-path=${SEEDGRID_SECURITY_AVATAR_FILESYSTEM_BASE_PATH:./data/seedgrid-security-files}
seedgrid.security.avatar.minio.bucket=${SEEDGRID_SECURITY_AVATAR_MINIO_BUCKET:}
seedgrid.security.avatar.minio.region=${SEEDGRID_SECURITY_AVATAR_MINIO_REGION:us-east-1}
seedgrid.security.avatar.minio.access-key=${SEEDGRID_SECURITY_AVATAR_MINIO_ACCESS_KEY:}
seedgrid.security.avatar.minio.secret-key=${SEEDGRID_SECURITY_AVATAR_MINIO_SECRET_KEY:}
seedgrid.security.avatar.minio.endpoint=${SEEDGRID_SECURITY_AVATAR_MINIO_ENDPOINT:}

# ==== Privacy (seedgrid-privacy): criptografia at-rest de PII ====
# Cifra em repouso o email/whatsApp (users) e o cnpj (companies) — via @EncryptedField ja presente
# no User/Company. O UserRepository ja busca por hash quando ligado (findByEmail bimodal).
# OPT-IN por ambiente e FAIL-CLOSED: se ligar sem as duas chaves, o boot falha de proposito (nunca
# grava PII em claro por acidente). Escolha o modo com o BANCO VAZIO — trocar com dados exige migracao.
# Gere as chaves (Base64): crypto = `openssl rand -base64 32` (AES-256); search = `openssl rand -base64 48`
# (HMAC, >=32 bytes). As chaves moram SO no env, NUNCA versionadas.
seedgrid.privacy.encryption.enabled=${SEEDGRID_PRIVACY_ENCRYPTION_ENABLED:false}
seedgrid.privacy.crypto.key=${SEEDGRID_PRIVACY_CRYPTO_KEY:}
seedgrid.privacy.search.key=${SEEDGRID_PRIVACY_SEARCH_KEY:}

# Self-enter (auto-cadastro por convite). Invite-only: o operador convida e escolhe as roles no convite.
# default-role = sentinela que NAO existe como role (NO_DEFAULT_ROLE): convite SEM roles estoura 422
# na aprovacao (role obrigatoria), evitando criar usuario sem role — ou ADMIN por engano.
# Nao pode ser string vazia: o @WithDefault do ext trata "" como null e o SmallRye falha no startup.
# Para ter uma role padrao de verdade, aponte esta env para uma role existente (ex.: um perfil de cliente).
seedgrid.security.self-enter.enabled=${SEEDGRID_SECURITY_SELF_ENTER_ENABLED:true}
seedgrid.security.self-enter.public-enabled=${SEEDGRID_SECURITY_SELF_ENTER_PUBLIC_ENABLED:false}
seedgrid.security.self-enter.invite-enabled=${SEEDGRID_SECURITY_SELF_ENTER_INVITE_ENABLED:true}
# Convite aceito ainda exige aprovacao manual do admin (PENDING_APPROVAL) por default. Setar
# =false pula direto pra aprovado: quem convidou ja escolheu o e-mail e as roles, entao o
# convite em si ja e' a aprovacao. NAO afeta self-enter publico (sempre exige aprovacao).
seedgrid.security.self-enter.invite-needs-approval=${SEEDGRID_SECURITY_SELF_ENTER_INVITE_NEEDS_APPROVAL:true}
seedgrid.security.self-enter.default-role=${SEEDGRID_SECURITY_SELF_ENTER_DEFAULT_ROLE:NO_DEFAULT_ROLE}
# A pagina PUBLICA de conclusao do convite mora em /auth/self-enter (o convidado completa nome +
# WhatsApp + senha; /security/self-enter e a tela de ADMIN que gerencia convites, nao serve).
# base-url vem do env do frontend.
seedgrid.security.frontend.self-enter-path=${SEEDGRID_SECURITY_FRONTEND_SELF_ENTER_PATH:/auth/self-enter}

seedgrid.security.first-admin-user.email=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_EMAIL:}
seedgrid.security.first-admin-user.name=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_NAME:}
seedgrid.security.first-admin-user.whatsapp=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_WHATSAPP:}
seedgrid.security.first-admin-user.initial-password=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_INITIAL_PASSWORD:}

# Empresa da PLATAFORMA, dona do webadmin. CNPJ exclusivo e reservado, diferente de qualquer
# cliente: o signup RECUSA este CNPJ, garantindo que a Company da plataforma nunca colida com a
# empresa de um tenant. A company default NAO tem flag de liga/desliga — e sempre garantida pelo
# seedgrid-security, porque o modelo de autorizacao depende dela.
seedgrid.security.default-company.cnpj=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CNPJ:99999999000199}
seedgrid.security.default-company.corporate-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CORPORATE_NAME:SeedGrid Plataforma}
seedgrid.security.default-company.trade-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_TRADE_NAME:SeedGrid Plataforma}
seedgrid.security.default-company.addr-street=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_STREET:}
seedgrid.security.default-company.addr-number=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_NUMBER:}
seedgrid.security.default-company.addr-complement=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_COMPLEMENT:}
seedgrid.security.default-company.addr-postal-code=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_POSTAL_CODE:}
seedgrid.security.default-company.addr-city=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_CITY:}
seedgrid.security.default-company.addr-state=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_STATE:}
seedgrid.security.default-company.addr-district=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_DISTRICT:}
seedgrid.security.default-company.addr-phone=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_PHONE:}
seedgrid.security.default-company.rep-first-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_FIRST_NAME:}
seedgrid.security.default-company.rep-last-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_LAST_NAME:}
seedgrid.security.default-company.rep-cpf=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_CPF:}
seedgrid.security.default-company.rep-birth-date=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_BIRTH_DATE:}
seedgrid.security.default-company.rep-phone=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_PHONE:}
seedgrid.security.default-company.rep-whatsapp=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_WHATSAPP:}
seedgrid.security.default-company.rep-email=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_EMAIL:}

# ============================================================================
# WHATSAPP (provider Evolution)
# ============================================================================
# Vazio = integracao desligada; o 2FA por WhatsApp some da lista de metodos disponiveis e o
# LoggingWhatsappSender manda so' pro log.
seedgrid.whatsapp.api=${SEEDGRID_WHATSAPP_API:}
seedgrid.whatsapp.rest-client.evolution.url=${SEEDGRID_WHATSAPP_REST_CLIENT_EVOLUTION_URL:}
seedgrid.whatsapp.evolution.api-key=${SEEDGRID_WHATSAPP_EVOLUTION_API_KEY:}

# ============================================================================
# BILLING / STRIPE
# ============================================================================
seedgrid.billing.provider=${SEEDGRID_BILLING_PROVIDER:stripe}
seedgrid.billing.stripe.apiKey=${SEEDGRID_BILLING_STRIPE_APIKEY:sk_test_placeholder}
seedgrid.billing.stripe.webhookSecret=${SEEDGRID_BILLING_STRIPE_WEBHOOKSECRET:whsec_test_placeholder}
# Produto base no Stripe (id fixo). A extensao garante (retrieve-or-create) no startup, entao
# nao precisa criar o produto manualmente no Dashboard — so a apiKey.
seedgrid.billing.stripe.product=${SEEDGRID_BILLING_STRIPE_PRODUCT:seedgrid-app}
seedgrid.billing.stripe.product-name=${SEEDGRID_BILLING_STRIPE_PRODUCT_NAME:SeedGrid App}
# Nome EXIBIDO do meter de excedente no Stripe Dashboard (o id tecnico e o event_name
# overage_<produto>, derivado do produto acima). Cosmetico.
seedgrid.billing.overage-meter-name=${SEEDGRID_BILLING_OVERAGE_METER_NAME:Excedente}

# O checkout e' SEMPRE montado pelo billing (POST /me/billing/checkout): o client so' manda o planId.
# Retorno do checkout: SEEDGRID_BILLING_STRIPE_DEFAULTSUCCESSURL / DEFAULTCANCELURL (dev.env).
# Para onde o customer portal redireciona ao sair (volta pro app/site).
seedgrid.billing.portal.return-url=${SEEDGRID_BILLING_PORTAL_RETURN_URL:http://localhost:3000/assinatura}

# Contadores de uso (o que o produto cobra por uso): declarados em billing/AppUsageMeters.java, contados
# com @ConsumesUsage(meter = ...) ou UsageService.consume(...). Franquia e excedente de cada contador sao
# do PLANO (tela de condicoes comerciais), nao de config. Guia: docs/contadores-de-uso.md.

# A empresa da plataforma nao tem plano: nunca e' bloqueada por funcionalidade do plano.
# seedgrid.billing.feature-gate.exempt-company-ids=1

# Trial: o billing cria a assinatura trial de toda conta nova (no confirm-email do cadastro, via
# login-tenancy, e na primeira chamada /me/* como rede de seguranca). A cota do trial e' a franquia de
# cada contador no term TRIAL (configurada na tela de Trial do admin); o vencimento por data e'
# o trialDays do plano. Sem nada a configurar aqui alem de ligar/desligar:
# seedgrid.billing.trial.enabled=true

# Compatibilidade de migração: channelId usado somente para importar uma configuração antiga de
# billing. As regras atuais definem canais e destinatários pela seedgrid-notification.

# ============================================================================
# ROBO DE PRECOS DE MODELO DE IA
# ============================================================================
# Checa a tabela de precos do provedor, compara e pede aprovacao. Liga/desliga, HORARIO (cron) e
# URL vivem na config editavel no admin (tabela ai_pricing_config / tela /ai/price-approvals).
# Esta property e so o DEFAULT da URL.
seedgrid.app.ai-pricing.source-url=${SEEDGRID_AI_PRICING_SOURCE_URL:https://developers.openai.com/api/docs/pricing}
# Fuso fixo em que o cron do robo e interpretado.
seedgrid.app.ai-pricing.timezone=${SEEDGRID_AI_PRICING_TIMEZONE:America/Sao_Paulo}
seedgrid.ai-pricing.migration.enabled=true
seedgrid.exchange.migration.enabled=true

# ============================================================================
# DIAGNOSTICO
# ============================================================================
# Sem isto, TODO 500 chega ao front como {"detail":"Ocorreu um erro interno...","devMessage":""} —
# a causa existe so' no stdout do processo, e quem esta' no browser fica sem nada para reportar.
# Ligado APENAS no perfil dev (`%dev.`): o `devMessage` carrega `ex.getMessage()`, que pode conter
# SQL, caminho de arquivo e nome de coluna — em producao isso e' vazamento, e por isso o default
# da foundation e' `false` e nao se mexe nele aqui.
%dev.seedgrid.show-dev-message=true

# ============================================================================
# LOGGING
# ============================================================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
