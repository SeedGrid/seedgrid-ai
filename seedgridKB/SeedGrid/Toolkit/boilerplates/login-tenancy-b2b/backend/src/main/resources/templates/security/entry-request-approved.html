<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Sua conta foi aprovada</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #777777; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f4f4f4; background-image: linear-gradient(#f4f4f4, #f4f4f4); color: #777777; padding: 20px; border-radius: 5px;">
        <div style="text-align:center; padding:4px 0 20px;">
            <img src="https://report-admin.seedgrid.com.br/logo-seedgrid-email.png" alt="SeedGrid Report" width="190" style="width:190px; max-width:62%; height:auto; display:inline-block;">
        </div>
        <h2 style="color: #C96A2D; margin-top: 0;">Parabéns, {name}!</h2>

        <p>Sua solicitação de acesso foi <strong>aprovada</strong>!</p>

        <p>Você já pode fazer login na plataforma usando o e-mail e senha que cadastrou.</p>

        <div style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); padding: 15px; border-radius: 5px; margin: 20px 0; border-left: 4px solid #C96A2D;">
            <p style="margin: 0;"><strong>E-mail:</strong> {email}</p>
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <a href="{loginLink}"
               style="background-color: #F7EAE1; background-image: linear-gradient(#F7EAE1, #F7EAE1); color: #C96A2D; border: 1px solid #E4C4A6; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold;">
                Fazer Login
            </a>
        </div>

        <p style="color: #7f8c8d; font-size: 14px;">
            Se tiver dúvidas, entre em contato com nosso suporte.
        </p>

        <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">

        <p style="color: #95a5a6; font-size: 12px; text-align: center;">
            SeedGrid Security Platform
        </p>
    </div>
</body>
</html>
