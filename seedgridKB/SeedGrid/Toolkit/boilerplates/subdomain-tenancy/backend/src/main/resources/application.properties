seedgrid.billing.stripe.apiKey=${SEEDGRID_BILLING_STRIPE_APIKEY:sk_test_placeholder}
seedgrid.billing.stripe.webhookSecret=${SEEDGRID_BILLING_STRIPE_WEBHOOKSECRET:whsec_test_placeholder}
