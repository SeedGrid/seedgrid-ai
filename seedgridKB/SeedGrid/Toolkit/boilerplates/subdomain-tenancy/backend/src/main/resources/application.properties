seedgrid.billing.portal.return-url=${SEEDGRID_BILLING_PORTAL_RETURN_URL:http://localhost:3000/assinatura}
# Contadores de uso (o que o produto cobra por uso): declarados em billing/AppUsageMeters.java, contados
# com @SgConsumesUsage(meter = ...) ou UsageService.consume(...). Franquia e excedente de cada contador sao
# do PLANO (tela de condicoes comerciais), nao de config. Guia: docs/contadores-de-uso.md.
seedgrid.app.ai-pricing.source-url=${SEEDGRID_AI_PRICING_SOURCE_URL:https://developers.openai.com/api/docs/pricing}
seedgrid.app.ai-pricing.timezone=${SEEDGRID_AI_PRICING_TIMEZONE:America/Sao_Paulo}
%dev.seedgrid.show-dev-message=true

# Teste: auditoria em jpa (sem Mongo). O indicador de saude do mongodb-client (propriedade de BUILD) esperaria 30 s por
# localhost:27017 e o /q/health nao responderia (BackendStartsGuardianTest). Em prod (strategy MONGODB) segue ligado.
%test.quarkus.mongodb.health.enabled=false
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}

seedgrid.subdomain-tenancy.product-prefix=${PRODUCT_PREFIX:sg}
seedgrid.subdomain-tenancy.domain-suffix=${SEEDGRID_SUBDOMAIN_TENANCY_DOMAIN_SUFFIX:localhost}
seedgrid.subdomain-tenancy.use-https=${SEEDGRID_SUBDOMAIN_TENANCY_USE_HTTPS:false}
seedgrid.subdomain-tenancy.port=${SEEDGRID_SUBDOMAIN_TENANCY_PORT:3002}
seedgrid.subdomain-tenancy.tenant.datasource.jdbc.url=${SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DB_URL:jdbc:postgresql://localhost:5441}
seedgrid.subdomain-tenancy.tenant.datasource.username=${SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DB_USERNAME:postgres}
seedgrid.subdomain-tenancy.tenant.datasource.password=${SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DB_PASSWORD:postgres}
seedgrid.subdomain-tenancy.master.datasource.jdbc.url=${SEEDGRID_SUBDOMAIN_TENANCY_MASTER_DB_URL:jdbc:postgresql://localhost:5441/sg_master}
quarkus.hibernate-orm.packages=br.com.seedgrid.security.entities,br.com.seedgrid.backup.entities,br.com.seedgrid.apikeys.entities,br.com.seedgrid.audit.postgresql.entities,br.com.seedgrid.businessdays.entities,br.com.seedgrid.cities.entities
quarkus.hibernate-orm.master.packages=br.com.seedgrid.aipricing.entities,br.com.seedgrid.subdomaintenancy.entities,br.com.seedgrid.billing,br.com.seedgrid.security.entities,br.com.seedgrid.app.api.admin,br.com.seedgrid.app.api.billing,br.com.seedgrid.exchange.entities,br.com.seedgrid.cities.entities
seedgrid.subdomain-tenancy.master.migrations.location.additional=classpath:db/migration/app
# Migrations do host em CADA banco de tenant (rodam depois do security: podem semear permissions).
seedgrid.subdomain-tenancy.tenant.migrations.location.additional=classpath:db/migration/app-tenant
seedgrid.security.bootstrap.enabled=false
seedgrid.security.frontend.base-url=${SEEDGRID_SECURITY_FRONTEND_BASE_URL:http://localhost:3002}
seedgrid.subdomain-tenancy.migration.login-paths=/public/auth/login
quarkus.swagger-ui.always-include=true
seedgrid.subdomain-tenancy.public-routes=/swagger-ui,/q/openapi,/q/health,/q/metrics,/public


# ============================================================================
# CIDADES (seedgrid-cities): a cidade do endereco (Address.city) e' FK para sg_cities. A REST de consulta fica ligada para o
# front escolher a cidade (id = o cityId aceito no cadastro/CRUD de empresas); exige a permissao CITY_READ (role ADMIN).
# ============================================================================
seedgrid.cities.rest.enabled=true
# Consulta PUBLICA de cidade (sem token) para o signup: o ViaCEP traz o codigo IBGE e o front resolve o cityId por
# /public/cities/by-ibge-code/{codigo} (via BFF /api/signup/city/{codigo}). Devolve SO' {id, name, uf, ibgeCode}, com
# rate limit por IP e global; a base de cidades nao pode ser copiada por aqui. O IP do visitante vem do X-Forwarded-For
# repassado pelo BFF; em producao o proxy da frente deve SOBRESCREVER esse cabecalho e o backend nao ser exposto direto.
seedgrid.cities.public-rest.enabled=${SEEDGRID_CITIES_PUBLIC_REST_ENABLED:true}
seedgrid.cities.public-rest.client-ip-header=${SEEDGRID_CITIES_PUBLIC_REST_CLIENT_IP_HEADER:X-Forwarded-For}
