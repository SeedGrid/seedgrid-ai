name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Valida o conteúdo empacotado
        run: node dist/cli.js validate
      - name: Confere o conteúdo do pacote npm
        run: node scripts/check-pack.mjs
      # P175: AVISO (nao reprova) quando um boilerplate fica atras da ultima versao publicada. O Nexus pede credencial
      # (SEEDGRID_NEXUS_USER/SEEDGRID_NEXUS_PASSWORD); sem ela o script avisa que nao conferiu e sai 0.
      - name: Avisa boilerplate atras da ultima publicada
        continue-on-error: true
        env:
          SEEDGRID_NEXUS_USER: ${{ secrets.SEEDGRID_NEXUS_USER }}
          SEEDGRID_NEXUS_PASSWORD: ${{ secrets.SEEDGRID_NEXUS_PASSWORD }}
        run: node scripts/check-boilerplate-versions.mjs
